name: CI

on:
    push:
        branches: [ 'main' ]
    pull_request:

permissions:
    contents: read

jobs:

    tests:
        name: Tests - PHP ${{ matrix.php }} ${{ matrix.dependency-version }}
        runs-on: ubuntu-latest
        timeout-minutes: 15
        strategy:
            fail-fast: false
            matrix:
                # Laravel 13 requires PHP 8.3, PHP 8.2 runs the tests on Laravel 12
                php: [ '8.2', '8.3', '8.4', '8.5' ]
                dependency-version: [ '' ]
                include:
                    -   php: '8.2'
                        dependency-version: '--prefer-lowest'
        steps:
            -   uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
            -   name: Setup PHP
                uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
                with:
                    php-version: ${{ matrix.php }}
                    coverage: none
            -   name: Get Composer cache directory
                id: composer-cache
                run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT
            -   name: Cache Composer dependencies
                uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
                with:
                    path: ${{ steps.composer-cache.outputs.dir }}
                    key: php-${{ matrix.php }}${{ matrix.dependency-version }}-composer-${{ hashFiles('composer.json') }}
                    restore-keys: php-${{ matrix.php }}${{ matrix.dependency-version }}-composer-
            -   name: Install PHP dependencies
                run: composer update ${{ matrix.dependency-version }} --prefer-dist --no-interaction
            -   name: Tests
                run: composer test:unit

    stores:
        name: Stores on real databases
        runs-on: ubuntu-latest
        timeout-minutes: 15
        services:
            mysql:
                image: mysql:8.4
                env:
                    MYSQL_DATABASE: test
                    MYSQL_USER: test
                    MYSQL_PASSWORD: test
                    MYSQL_RANDOM_ROOT_PASSWORD: '1'
                ports: [ '3306:3306' ]
                options: --health-cmd="mysqladmin ping" --health-interval=5s --health-timeout=5s --health-retries=20
            postgres:
                image: postgres:17-alpine
                env:
                    POSTGRES_DB: test
                    POSTGRES_USER: test
                    POSTGRES_PASSWORD: test
                ports: [ '5432:5432' ]
                options: --health-cmd=pg_isready --health-interval=5s --health-timeout=5s --health-retries=20
            dynamodb:
                image: amazon/dynamodb-local:latest
                ports: [ '8000:8000' ]
        steps:
            -   uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
            -   name: Setup PHP
                uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
                with:
                    php-version: '8.5'
                    coverage: none
            -   name: Install PHP dependencies
                run: composer update --prefer-dist --no-interaction
            -   name: MySQL
                run: composer test:integration -- --filter DatabaseStoreTest
                env:
                    TEST_DB_DRIVER: mysql
                    TEST_DB_PORT: '3306'
            -   name: PostgreSQL
                run: composer test:integration -- --filter DatabaseStoreTest
                env:
                    TEST_DB_DRIVER: pgsql
                    TEST_DB_PORT: '5432'
            -   name: DynamoDB
                run: composer test:integration -- --filter DynamoDbStoreTest
                env:
                    TEST_DYNAMODB_ENDPOINT: http://127.0.0.1:8000

    checks:
        name: Lint, types and type coverage
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            -   uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
            -   name: Setup PHP
                uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
                with:
                    php-version: '8.5'
                    coverage: none
            -   name: Get Composer cache directory
                id: composer-cache
                run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT
            -   name: Cache Composer dependencies
                uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
                with:
                    path: ${{ steps.composer-cache.outputs.dir }}
                    key: php-8.5-composer-${{ hashFiles('composer.json') }}
                    restore-keys: php-8.5-composer-
            -   name: Install PHP dependencies
                run: composer update --prefer-dist --no-interaction
            -   name: Coding style
                run: composer test:lint
            -   name: Types
                run: composer test:types

